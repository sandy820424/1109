<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚀 AI Prompt 智能寶庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f5f7;
    }
    /* 自訂捲動條樣式，確保卡片內容區簡潔美觀 */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 pb-16">

  <!-- 頂部 Header 區域 -->
  <header class="pt-8 pb-4 text-center px-4">
    <h1 class="text-3xl md:text-4xl font-bold flex items-center justify-center gap-2 text-slate-900 mb-2">
      🚀 AI Prompt 智能寶庫
    </h1>
    <a href="https://docs.google.com/spreadsheets/d/1oKvF9Hb0OQ9uCMI-BiWwfi6VG4ZftFkLY8-RVa9_9fM/edit?gid=1480282197#gid=1480282197" 
       target="_blank" 
       rel="noopener noreferrer"
       class="inline-flex items-center gap-1.5 text-xs md:text-sm text-slate-500 hover:text-blue-600 bg-white px-3 py-1 rounded-full shadow-sm border border-slate-200 transition">
      <i class="fa-regular font-bold fa-file-excel text-green-600"></i>
      開啟原始資料 Google Sheet
    </a>
  </header>

  <!-- 主控搜尋與分類標籤區域 -->
  <section class="max-w-6xl mx-auto px-4 mt-2">
    <!-- 搜尋框 -->
    <div class="relative max-w-xl mx-auto mb-6">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
      <input type="text" id="searchInput" 
             placeholder="搜尋提示詞、標題或關鍵字..." 
             class="w-full pl-11 pr-10 py-3 bg-white border border-slate-200 rounded-full shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
      <button id="clearSearchBtn" class="hidden absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- 分類標籤篩選按鈕列 -->
    <div class="flex flex-wrap items-center justify-center gap-2 mb-6" id="categoryContainer">
      <!-- 由 JavaScript 動態生成按鈕 -->
    </div>

    <!-- 數值與狀態連動資訊欄 -->
    <div class="flex flex-wrap items-center justify-between bg-white px-6 py-3 rounded-2xl shadow-sm border border-slate-100 mb-8 max-w-6xl mx-auto text-sm">
      <div class="flex items-center gap-2 text-slate-600">
        <span>目前檢視分類：<strong id="currentCategoryLabel" class="text-blue-600">全部</strong></span>
        <span class="text-slate-300">|</span>
        <span>共計找到 <strong id="promptCount" class="text-slate-900 font-bold text-base">0</strong> 項提示詞</span>
      </div>
      <div class="flex items-center gap-3 mt-2 sm:mt-0">
        <button id="openAddModalBtn" class="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs px-3.5 py-1.5 rounded-lg transition shadow-sm font-medium">
          <i class="fa-solid fa-plus"></i> 新增 Prompt
        </button>
      </div>
    </div>
  </section>

  <!-- Prompt 卡片清單區 (依 Type 分組顯示) -->
  <main class="max-w-6xl mx-auto px-4 space-y-10" id="promptsMainContainer">
    <!-- 由 JavaScript 動態繪製卡片區塊 -->
  </main>

  <!-- 新增 Prompt Modal 模態視窗 -->
  <div id="addModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 relative animate-fade-in">
      <button id="closeModalBtn" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      <h3 class="text-lg font-bold text-slate-900 mb-4">✨ 新增 AI Prompt</h3>
      <form id="addPromptForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">AI 類型 (Type)</label>
          <input type="text" id="inputSection" placeholder="例如：🧠 AI 協思, 🛠️ AI 協做" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">分類 (Category)</label>
            <input type="text" id="inputCategory" placeholder="例如：內容創作" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">標題 (Title)</label>
            <input type="text" id="inputTitle" placeholder="例如：意義單詞" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Prompt 內容</label>
          <textarea id="inputContent" rows="6" placeholder="請輸入提示詞內容..." required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none custom-scrollbar"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="cancelModalBtn" class="px-4 py-2 rounded-xl text-xs text-slate-600 hover:bg-slate-100 transition">取消</button>
          <button type="submit" class="px-5 py-2 rounded-xl text-xs bg-blue-600 text-white hover:bg-blue-700 transition font-medium">儲存新增</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript 邏輯控制與連動功能 -->
  <script>
    // 預設資料庫（整合畫面中的 Prompt 資料）
    const initialPrompts = [
      {
        id: "1",
        section: "🧠 AI 協思",
        category: "內容創作",
        title: "意義單詞",
        content: "將文章的重點部分，尋找一個代表性英文字母，並使這些字母的首字組合成一個具有意義的單詞（如「VISION」）"
      },
      {
        id: "2",
        section: "🧠 AI 協思",
        category: "內容創作",
        title: "品牌名稱",
        content: "完成 ChatGPT 角色定義後，依據\"品牌定義\"與\"產品介紹\"發想5個個產品名稱與標題（口號）。\n- 提示詞指令：描述品牌與產品，請列出 數字 個產品名稱與行銷標題建議。（\"品牌定義\"描述、\"產品介紹\"描述）\n- Prompt\n- 我推出一個運動鞋品牌，今年會銷售一款新型跑步"
      },
      {
        id: "3",
        section: "🧠 AI 協思",
        category: "筆記精煉",
        title: "長篇文章",
        content: "為這篇長篇文章，進行以下四個步驟，每一個步驟都要提供給我文章與標示出來\n第1、請為這篇長文件生成一份簡短摘要。\n第2、請基於上一個摘要，不要遺漏任何專有名詞、數字或關鍵人物，重新生成一份摘要。\n第3、現在，請將摘要中每一句話都濃縮成更簡潔的表達，同時保留核心資訊與邏輯脈絡。"
      },
      {
        id: "4",
        section: "🧠 AI 協思",
        category: "筆記精煉",
        title: "書籍精煉",
        content: "請對 @[檔名]\n啟動【終極煉金管線】，一次執行四步驟整合：\n第一步：全域架構導航 (Stage 01)\n執行 stage-1-navigator，對精煉稿進行深度掃描，產出知識地圖與反直覺預警。\n存檔：01_Map_[主題簡稱].md。\n第二步：價值 DNA 診斷 (Stage 02)"
      },
      {
        id: "5",
        section: "🧠 AI 協思",
        category: "筆記精煉",
        title: "書籍精煉 2",
        content: "請針對上文進行精煉與摘要，提出至少三個核心章節的關鍵洞察，並附加執行建議事項。"
      },
      {
        id: "6",
        section: "🧠 AI 協思",
        category: "筆記精煉",
        title: "提取練習",
        content: "我剛讀完了關於 [填入具體段落標題] 的內容。現在請幫我進行深度研磨：\n\n1-底層邏輯拷問：針對這段內容的「運作原理」向我提問，測試我是否理解了「為什麼有效」，而非只是記住步驟。\n\n2-隱喻轉化：如果這段概念有複雜之處，請用日常生活常見的比喻輔助解釋。"
      },
      {
        id: "7",
        section: "🧠 AI 協思",
        category: "內容創作",
        title: "影片清理",
        content: "你的角色是一位「逐字稿校對員」，不是編輯。\n任務：\n1-僅刪除口語填充詞、重複說法、明顯贅詞\n2-不得改寫句型、不得改變原意、不得加入新解釋\n規則：\n1-原句順序必須完全一致\n2-若刪除任何詞語，需確保前後文順暢"
      },
      {
        id: "8",
        section: "🧠 AI 協思",
        category: "內容創作",
        title: "影片清理 2",
        content: "你的角色是一位「內容結構化整理員」，不是編輯、不是評論者。\n\n我會提供一段約 4000 字的影片文字內容，請你在完全保留原作者語意與立場的前提下，\n進行「保留語意的濃縮」，將內容壓縮至約 2000 字。全文用繁體中文呈現。"
      },
      {
        id: "9",
        section: "🧠 AI 協思",
        category: "程式應用",
        title: "除錯梳理",
        content: "請先不要撰寫任何程式碼。針對目前出現的錯誤，進行系統性的分析與拆解，並依序說明：\n1-錯誤的具體現象與發生條件\n2-可能的成因（包含假設與不確定點）\n3-每一項成因對應的影響範圍\n4-可行的對策方向與取捨說明"
      },
      {
        id: "10",
        section: "🛠️ AI 協做",
        category: "程式生成",
        title: "表單生成",
        content: "依據附件，為我設計一份「課前需求調查問卷」，題目約10~12題，並直接提供可執行的 Google Apps Script (GAS) 程式碼，運用程式生成的方式是 Google 表單，目的是調查大家使用 AI 的狀況。"
      },
      {
        id: "11",
        section: "🤖 AI 助理",
        category: "文本優化",
        title: "課程推廣",
        content: "# 你是一名社群小編，擅長撰寫課程推廣文案，將我提供給資訊變成 PO 文，PO 到 FB/IG 等社群平台：\n- 課程名稱：[〇]\n- 關鍵字：[〇]\n- 課程介紹：[課程介紹文字]\n- PO文語氣：活潑、熱情、專業"
      }
    ];

    // 全局狀態
    let promptsList = [...initialPrompts];
    let selectedCategory = "全部";
    let searchQuery = "";

    // 預設分類選項
    const categoriesList = [
      "全部", "內容創作", "筆記精煉", "程式應用", "簡報表達", 
      "程式生成", "文本優化", "生文校正", "專案企劃", "圖片生成", 
      "筆記整理", "資訊整理", "心智圖法"
    ];

    // DOM 元素引用
    const categoryContainer = document.getElementById("categoryContainer");
    const currentCategoryLabel = document.getElementById("currentCategoryLabel");
    const promptCount = document.getElementById("promptCount");
    const promptsMainContainer = document.getElementById("promptsMainContainer");
    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");

    // Modal DOM
    const addModal = document.getElementById("addModal");
    const openAddModalBtn = document.getElementById("openAddModalBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const cancelModalBtn = document.getElementById("cancelModalBtn");
    const addPromptForm = document.getElementById("addPromptForm");

    // 初始化渲染
    function init() {
      renderCategories();
      renderPrompts();
      setupEventListeners();
    }

    // 渲染分類 Tag 按鈕
    function renderCategories() {
      categoryContainer.innerHTML = "";
      categoriesList.forEach(cat => {
        const btn = document.createElement("button");
        const isSelected = cat === selectedCategory;
        btn.className = `px-4 py-1.5 rounded-full text-xs md:text-sm font-medium transition duration-200 cursor-pointer shadow-sm ${
          isSelected 
            ? "bg-blue-600 text-white shadow-blue-200 shadow-md scale-105" 
            : "bg-white text-slate-600 hover:bg-slate-100 border border-slate-200"
        }`;
        btn.innerText = cat;
        btn.addEventListener("click", () => {
          selectedCategory = cat;
          renderCategories();
          renderPrompts();
        });
        categoryContainer.appendChild(btn);
      });
    }

    // 依狀態篩選並渲染 Prompt 卡片清單
    function renderPrompts() {
      // 1. 進行類別與關鍵字篩選
      const filtered = promptsList.filter(item => {
        const matchCategory = (selectedCategory === "全部") || (item.category === selectedCategory);
        const matchSearch = searchQuery === "" || 
          item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
          item.content.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.category.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCategory && matchSearch;
      });

      // 2. 更新連動狀態面板
      currentCategoryLabel.innerText = selectedCategory;
      promptCount.innerText = filtered.length;

      // 3. 畫面清空
      promptsMainContainer.innerHTML = "";

      if (filtered.length === 0) {
        promptsMainContainer.innerHTML = `
          <div class="text-center py-16 bg-white rounded-3xl border border-dashed border-slate-300">
            <i class="fa-regular fa-folder-open text-4xl text-slate-300 mb-3"></i>
            <p class="text-slate-500 font-medium text-sm">找不到符合條件的提示詞</p>
            <p class="text-slate-400 text-xs mt-1">請嘗試更換搜尋關鍵字或選擇其他分類</p>
          </div>
        `;
        return;
      }

      // 4. 按 Section (如 🧠 AI 協思) 進行分組
      const grouped = {};
      filtered.forEach(item => {
        if (!grouped[item.section]) {
          grouped[item.section] = [];
        }
        grouped[item.section].push(item);
      });

      // 5. 繪製各分區與卡片
      Object.keys(grouped).forEach(sectionTitle => {
        const sectionWrapper = document.createElement("div");
        sectionWrapper.className = "space-y-4";

        // 分區標題
        const header = document.createElement("h2");
        header.className = "text-xl font-bold text-slate-900 flex items-center gap-2";
        header.innerHTML = `${sectionTitle}`;
        sectionWrapper.appendChild(header);

        // 卡片網格 Grid (圖片樣式 4 欄適應)
        const grid = document.createElement("div");
        grid.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4";

        grouped[sectionTitle].forEach(prompt => {
          const card = document.createElement("div");
          card.className = "bg-white rounded-2xl shadow-sm border border-slate-100 flex flex-col overflow-hidden relative group hover:shadow-md transition-all duration-200";

          // 上方頂部亮紫/藍色條紋 (同設計圖)
          const topBar = document.createElement("div");
          topBar.className = "h-1.5 bg-gradient-to-r from-purple-500 to-indigo-500 w-full";

          // 卡片主要內容
          card.appendChild(topBar);
          card.innerHTML += `
            <div class="p-5 flex-1 flex flex-col justify-between">
              <div>
                <!-- 分類 Tag (藍色 pill) -->
                <div class="inline-block bg-sky-50 text-sky-600 text-[11px] font-semibold px-2.5 py-0.5 rounded-full mb-2">
                  ${prompt.category}
                </div>
                <!-- 標題 -->
                <h3 class="font-bold text-slate-900 text-base mb-3 leading-snug">
                  ${prompt.title}
                </h3>
                <!-- Prompt 內容預覽框 (同附圖灰底長框) -->
                <div class="bg-slate-50 border border-slate-100 rounded-xl p-3 text-xs text-slate-600 leading-relaxed max-h-44 overflow-y-auto custom-scrollbar whitespace-pre-wrap">
                  ${escapeHtml(prompt.content)}
                </div>
              </div>
            </div>
            <!-- 複製按鈕 (亮藍色圓角按鈕) -->
            <div class="px-5 pb-5 pt-1">
              <button onclick="copyToClipboard('${prompt.id}', this)" 
                      class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-medium text-xs py-2.5 rounded-xl transition duration-150 flex items-center justify-center gap-1.5 shadow-sm">
                <i class="fa-regular fa-copy"></i>
                複製 Prompt
              </button>
            </div>
          `;

          grid.appendChild(card);
        });

        sectionWrapper.appendChild(grid);
        promptsMainContainer.appendChild(sectionWrapper);
      });
    }

    // HTML 轉義避開語法問題
    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 一鍵複製與動態視覺反饋
    window.copyToClipboard = function(id, btnElement) {
      const targetItem = promptsList.find(p => p.id === id);
      if (!targetItem) return;

      const textToCopy = targetItem.content;
      
      // 使用剪貼簿 API，附帶 fallback 支援
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy);
      } else {
        const textarea = document.createElement("textarea");
        textarea.value = textToCopy;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }

      // 按鈕狀態連動轉為「已複製！」
      const originalHTML = btnElement.innerHTML;
      btnElement.className = "w-full bg-emerald-600 text-white font-medium text-xs py-2.5 rounded-xl transition duration-150 flex items-center justify-center gap-1.5 shadow-sm";
      btnElement.innerHTML = `<i class="fa-solid fa-check"></i> 已複製！`;

      setTimeout(() => {
        btnElement.className = "w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-medium text-xs py-2.5 rounded-xl transition duration-150 flex items-center justify-center gap-1.5 shadow-sm";
        btnElement.innerHTML = originalHTML;
      }, 2000);
    };

    // 事件監聽設置
    function setupEventListeners() {
      // 搜尋連動
      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value.trim();
        if (searchQuery.length > 0) {
          clearSearchBtn.classList.remove("hidden");
        } else {
          clearSearchBtn.classList.add("hidden");
        }
        renderPrompts();
      });

      // 清空搜尋
      clearSearchBtn.addEventListener("click", () => {
        searchInput.value = "";
        searchQuery = "";
        clearSearchBtn.classList.add("hidden");
        renderPrompts();
      });

      // Modal 開啟/關閉
      openAddModalBtn.addEventListener("click", () => addModal.classList.remove("hidden"));
      closeModalBtn.addEventListener("click", () => addModal.classList.add("hidden"));
      cancelModalBtn.addEventListener("click", () => addModal.classList.add("hidden"));

      // 新增 Prompt 表單送出
      addPromptForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const section = document.getElementById("inputSection").value.trim();
        const category = document.getElementById("inputCategory").value.trim();
        const title = document.getElementById("inputTitle").value.trim();
        const content = document.getElementById("inputContent").value.trim();

        const newPrompt = {
          id: Date.now().toString(),
          section: section || "🧠 AI 協思",
          category: category || "一般",
          title: title,
          content: content
        };

        promptsList.unshift(newPrompt);

        // 如果有新類別，加入 categoriesList
        if (!categoriesList.includes(category)) {
          categoriesList.push(category);
          renderCategories();
        }

        addPromptForm.reset();
        addModal.classList.add("hidden");
        renderPrompts();
      });
    }

    // 啟動應用
    init();
  </script>
</body>
</html>
